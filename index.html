<html><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1252">

<style>
    * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
    }

    body {
        height: 100vh;
        width: 100vw;
        font-family: Arial, Helvetica, sans-serif;
    }

    .bg-img {
        height: 100%;
        width: 100%;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
    }
    iframe {
        height: 100%;
        width: 100%;
    }

    /* Add styles to the form container */
    .container {
        max-width: 400px;
        padding: 16px;
        background-color: white;
        border-radius: 5px;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
    }

    @media (max-width: 480px) {
        .container {
            left: 10%;
            top: 10%;
            margin-left: 5%;
            transform: translate(-10%, -10%);
        }
    }

    /* Full-width input fields */
    input[type=text], input[type=password] {
        width: 100%;
        padding: 15px;
        margin: 5px 0 22px 0;
        border: none;
        background: #f1f1f1;
    }

    input[type=text]:focus, input[type=password]:focus {
        background-color: #ddd;
        outline: none;
    }

    .btn {
        background-color: #0096FF;
        color: white;
        padding: 16px 20px;
        border: none;
        cursor: pointer;
        width: 100%;
        opacity: 0.9;
    }

    .btn:hover {
        opacity: 1;
    }

    .img {
        text-align: center;
    }

    #title {
        text-align: center;
        margin: 10px 0;
    }

    #error {
        display: none;
        color: red;
    }


    .disabled{
        display: none;
    }

    .show{
        display: block;
    }
 

   
</style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  outline: none;
  list-style: none;
  box-sizing: border-box;
  border-style: none;
  border: 0;
  box-shadow: none;
  text-shadow: none;
  -webkit-tap-highlight-color: transparent;
}

.download-modal {
  --border-color: #00000026;
  @apply fixed z-[2147483647] w-[360px] h-auto m-[16px];
  @apply cursor-move;
  @apply text-[#333] bg-white;
  @apply rounded;
  box-shadow: 0.5px 0.5px 1px 1px #00000026;
  font-size: 16px;
  font-weight: 400;
}

.download-modal:hover .close-icon {
  @apply flex;
}

.download-modal .close-icon {
  @apply w-[24px] h-[24px];
  @apply items-center justify-center;
  @apply border border-solid border-gray-300 rounded-full;
  @apply hidden absolute top-0 right-0 z-[999];
  @apply bg-white text-[#898989];
  @apply cursor-pointer transition-all translate-x-[50%] translate-y-[-50%];
  font-size: 12px;
}

.download-modal .close-icon:hover {
  @apply rotate-180;
}

@supports (scrollbar-width: thin) {
  * {
    scrollbar-width: thin;
    scrollbar-color: #dedede #f7f7f7;
    transition: 0.1s scrollbar-color;
  }
  *:hover {
    scrollbar-color: #cccccc #f7f7f7;
  }
}

@supports not (scrollbar-width: thin) {
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
    background: #f7f7f7;
  }

  ::-webkit-scrollbar-thumb {
    border-radius: 6px;
    width: 6px;
    height: 6px;
    background: #dedede;
    background-clip: content-box;
  }

  ::-webkit-scrollbar:horizontal {
    border-top: 1px solid #eeeeee;
  }
  ::-webkit-scrollbar:vertical {
    border-top: 1px solid #eeeeee;
  }

  ::-webkit-scrollbar-thumb:horizontal {
    border-top-width: 2px;
  }

  ::-webkit-scrollbar-thumb:vertical {
    border-left-width: 2px;
  }


  :hover::-webkit-scrollbar-thumb {
    background-color: #cccccc;
  }

  ::-webkit-scrollbar-corner {
    background: #e5e5e5;
  }
}

.pay-warpper_radio-group {
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 0 0 1px #dcdfe6 inset;
}

.pay-warpper_radio-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin: 0;
  border: 1px solid #dcdfe6;
  border-left: none;
  background-color: #fff;
  transition: all 0.3s;
  user-select: none;
  overflow: hidden;
}

.pay-warpper_radio-button:first-child {
  border-left: 1px solid #dcdfe6;
}

.pay-warpper_radio-button:hover {
  color: #dc0a0a;
}

.pay-warpper_radio-button.is-active {
  background-color: #dc0a0a;
  color: #fff;
  border-color: #dc0a0a;
}

.pay-warpper_radio-button-input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.pay-warpper_radio-button-label {
  display: inline-block;
  padding: 8px 15px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}

/* Native Button Styles */
.pay-warpper_native-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  height: 32px;
  white-space: nowrap;
  cursor: pointer;
  text-align: center;
  box-sizing: border-box;
  outline: none;
  transition: all 0.1s;
  font-weight: 500;
  user-select: none;
  padding: 8px 15px;
  font-size: 14px;
  border-radius: 4px;
  border: 1px solid transparent;
}

.pay-warpper_native-button-danger {
  color: #fff;
  background-color: #dc0a0a;
  border-color: #dc0a0a;
}

.pay-warpper_native-button-danger:hover {
  background-color: #dc4444;
  border-color: #dc4444;
}

.pay-warpper_native-button-danger:active {
  background-color: #dd6161;
  border-color: #dd6161;
}

.pay-warpper_native-button-danger:focus {
  outline: none;
}


/* email-list-pane.vue */
.email-list-pane {
  display: flex;
  flex-direction: column;
  font-size: 14px;
}

.email-count-label {
  display: inline;
  font-size: 1rem;
}

.email-text {
  display: block;
  width: 100%;
  height: 200px;
  padding: 0.375rem 0.75rem;
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.5;
  color: #495057;
  background-color: #fff;
  background-clip: padding-box;
  border: 1px solid #ced4da;
  border-radius: 0.25rem;
  transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
  word-break: break-all;
  word-wrap: break-word;
  white-space: pre-wrap;
  overflow: auto;
}

.footer-actions {
  padding: 0 4px;
  display: flex;
  justify-content: space-between;
